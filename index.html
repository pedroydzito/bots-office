<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#eceef2" />
    <title>Escritório de Bots</title>
    <link rel="preconnect" href="https://ntfy.sh" crossorigin />
    <link rel="dns-prefetch" href="https://ntfy.sh" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bots" />
    <meta name="description" content="Escritório 3D ao vivo dos seus Grok Bots." />
    <style>
      /* paint the background instantly while the app loads */
      html, body { margin: 0; background: #eceef2; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot img { width: 48px; height: 48px; animation: b 1.2s ease-in-out infinite; }
      @keyframes b { 50% { transform: scale(0.9); opacity: 0.7; } }
      @media (prefers-color-scheme: dark) { html, body { background: #0c1120; } }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/favicon.svg" alt="" /></div></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
